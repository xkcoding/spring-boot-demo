name: GitHub CI
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    env:
      MAVEN_OPTS: "-DskipTests=true -Dmaven.javadoc.skip=true"
    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        java-version: 8
        distribution: 'zulu'
    - name: Build with Maven
      run: mvn clean package -B -V